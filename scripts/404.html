<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أفق المعرفة — {{STATUS}}</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #F9FBFC;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: #0F172A;
    padding: 24px;
  }
  main { text-align: center; max-width: 480px; }
  .num {
    font-size: 84px;
    font-weight: 800;
    color: #0F4C5C;
    line-height: 1;
    letter-spacing: 4px;
    direction: ltr;
  }
  h1 { font-size: 22px; font-weight: 700; margin: 8px 0 10px; color: #0A3A47; }
  p { font-size: 15px; color: #475569; line-height: 1.8; }
  a.bt {
    display: inline-block;
    margin-top: 22px;
    padding: 10px 22px;
    background: #0F4C5C;
    color: #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
  }
  a.bt:hover { background: #0A3A47; }
</style>
</head>
<body>
<main>
  <div class="num">{{STATUS}}</div>
  <h1>الصفحة غير متاحة</h1>
  <p>{{MESSAGE}}</p>
  <a class="bt" href="/">العودة إلى الرئيسية</a>
</main>
</body>
</html>
