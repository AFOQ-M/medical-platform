<style>
/* ============================================================
   أفق المعرفة — CSS الحرج (Critical CSS) — PageSpeed Step 4
   ------------------------------------------------------------
   هذا الملف نسخة حرفية من الأقسام "فوق الطيّ" في css/style.css:
   tokens + أساسيات + skip-link + الهيدر + main + breadcrumb +
   أزرار + الهيرو (بحث/رئيسية/هبوط) + التذييل + الاستجابة الحرجة.

   يُضمَّن inline داخل <head> في كل الصفحات الـ14 (أول رسم فوري)،
   بينما يُحمَّل style.css بشكل غير محجوب (media="print" onload).

   ⚠️ قاعدة صيانة: أي تعديل على هذه الأقسام في style.css يجب أن
   يُنقل هنا حرفيًا — وإلا حدث انحراف بصري (FOUC) بين الرسم الأول
   واكتمال تحميل style.css.
   ============================================================ */

:root {
  /* ألوان الهوية */
  --bg: #F9FBFC;
  --muted-bg: #EEF4F6;
  --surface: #FFFFFF;
  --ink: #0F172A;
  --ink-soft: #475569;
  --ink-faint: #94A3B8; /* تباين 2.56:1 على أبيض — استخدم فقط مع نص كبير/عريض (≥18.7px عريض) وليس لنص المحتوى العادي، حفاظًا على WCAG AA */
  --primary: #0F4C5C;
  --primary-dark: #0A3A47;
  --secondary: #1F7A8C;
  --accent: #E9A426;
  --accent-focus: #B45309; /* حلقة التركيز — يحقق 3:1 UI على كل الأسطح (K.1: 5.02:1 على الأبيض) */
  --accent-ink: #B45309; /* PageSpeed Step 7: نص/أيقونات/حدود بلون التمييز على الأسطح الفاتحة — 4.59:1 على --bg (AA نص عادي) بدل --accent (2.05:1 فاشل) */
  --inverse: #0F2A33;
  --line: #E2E8F0;
  --line-strong: #CBD5E1;
  --danger: #DC2626;
  --danger-bg: #FEF2F2;
  --danger-border: #FECACA;
  --success-bg: #E4F5EA;
  --success-border: #BFE6CC;
  --success-text: #166534;
  --success: #147D45; /* نص/أيقونات النجاح العام — 4.58:1 على --success-bg (K.1) */
  --neutral-bg: #F1F1F1;
  --warning: #B45309; /* قيد المراجعة/بلاغ معلّق — 4.51:1 على --warning-bg (K.1) */
  --warning-bg: #FEF3C7;
  --warning-border: #FDE68A;
  --focus: var(--accent-focus);

  /* ألوان أنواع الموارد — شارات فاتحة + نص/حدود بدرجة داكنة لضمان تباين واضح */
  --type-book: #5B21B6;
  --type-book-bg: #EDE9FE;
  --type-summary: #0F766E;
  --type-summary-bg: #CCFBF1;
  --type-questions: #147D45;
  --type-questions-bg: #E4F5EA;
  --type-lecture: #0E7490;
  --type-lecture-bg: #E0F2F7;
  --type-slides: #1F7A8C;
  --type-slides-bg: #E6F0F3;
  --type-notes: #92400E;
  --type-notes-bg: #FEF3C7;
  --type-past_exam: #9D174D;
  --type-past_exam-bg: #FCE7F3;

  --radius: var(--radius-lg);
  --radius-sm: 8px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-full: 999px;

  /* الحدود — مرجعية دلالية للاستخدام في المكوّنات */
  --border-hair: 1px solid var(--line);
  --border-strong: 1px solid var(--line-strong);
  --border-accent: 2px solid var(--primary);

  --shadow: 0 2px 10px rgba(18, 38, 42, 0.06);
  --shadow-hover: 0 8px 24px rgba(18, 38, 42, 0.12);

  /* الحاوية العامة — حد أقصى موحّد */
  --container-max: 1120px;

  /* الحركة — V: micro 120–150ms / state 180–220ms، transform+opacity فقط */
  --dur-micro: 150ms;
  --dur-std: 220ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);

  /* ============================================
     طبقات العرض (Z-index scale — G-17)
     قيم مطابقة حرفيًا للاستخدامات الحالية — لا تغيير في سلوك الـ stacking
     ============================================ */
  --z-base: 0;      /* الطبقة الأساسية — الزخارف الخلفية خلف المحتوى */
  --z-content: 1;   /* المحتوى فوق الزخارف (hero / horizon) */
  --z-header: 50;   /* الترويسة اللاصقة (.site-header) */
  --z-floating: 90; /* عنصر عائم منخفض (.back-to-top) */
  --z-overlay: 100; /* طبقة overlay المشتركة (modal / sidebar / search) */
  --z-sidebar: 101; /* لوحة الحساب الجانبية فوق الـ overlay مباشرة */
  --z-toast: 200;   /* إشعارات الـ toast فوق الطبقات التطبيقية */
  --z-top: 1000;    /* أعلى طبقة — .skip-link عند التركيز */

  /* ============================================
     نقاط التحويل (Breakpoint scale — G-18)
     قيم مطابقة لـ @media الحالية حرفيًا — مرجع دلالي فقط، لا تُستخدم داخل @media
     ============================================ */
  --bp-hand: 480px;
  --bp-phablet: 560px;
  --bp-tablet: 640px;
  --bp-laptop: 720px;
  --bp-desk: 960px;

  /* ============================================
     Phase 1 — Design Tokens (Spacing + Typography)
     إضافة تأسيسية فقط — لا استخدام حالي، تمهيدًا لمراحل لاحقة
     ============================================ */

  /* Spacing scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* Font families (نفس القيم الحالية المستخدَمة فعليًا — بلا تغيير) */
  --font-display: 'Cairo', sans-serif;
  --font-body: 'Tajawal', sans-serif;

  /* Typography scale — (font-size / line-height / font-weight) لكل دور */
  --text-display-size: clamp(1.6rem, 1.1rem + 2vw, 2.2rem);
  --text-display-lh: 1.25;
  --text-display-weight: 800;

  --text-h2-size: 1.25rem;
  --text-h2-lh: 1.3;
  --text-h2-weight: 800;

  --text-h3-size: 1.05rem;
  --text-h3-lh: 1.4;
  --text-h3-weight: 700;

  --text-body-size: 1rem;
  --text-body-lh: 1.65;
  --text-body-weight: 400;

  --text-body-strong-weight: 700;

  --text-meta-size: 0.85rem;
  --text-meta-lh: 1.5;
  --text-meta-weight: 400;

  --text-label-size: 0.9rem;
  --text-label-lh: 1.4;
  --text-label-weight: 700;

  --text-data-size: 0.9rem;
  --text-data-weight: 500;

  --text-longform-size: 1rem;
  --text-longform-lh: 1.8;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  /* مع الهيدر اللاصق: أهداف المراسي تظهر أسفل الهيدر لا مخفية تحته */
  scroll-padding-top: 96px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Tajawal', 'Tajawal fallback', sans-serif;
  direction: rtl;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, h4, .display {
  font-family: 'Cairo', 'Cairo fallback', sans-serif;
  font-weight: 800;
  color: var(--primary-dark);
  margin: 0 0 .4em;
}

a { color: inherit; text-decoration: none; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

img { max-width: 100%; display: block; }

/* -------------------- تخطي إلى المحتوى (UI-7B) -------------------- */

.skip-link {
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  transform: translateY(-150%);
  background: var(--primary-dark);
  color: #fff;
  font-family: 'Tajawal', 'Tajawal fallback', sans-serif;
  font-weight: 700;
  font-size: .9rem;
  padding: 12px 20px;
  border-end-end-radius: var(--radius-sm);
  z-index: var(--z-top);
  transition: transform var(--dur-micro);
}

.skip-link:focus {
  transform: translateY(0);
}

/* -------------------- الرأس -------------------- */

.site-header {
  background: var(--primary);
  color: #fff;
  padding: 16px 20px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: var(--z-header);
}

.site-header .header-inner {
  max-width: var(--container-max);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  font-family: 'Cairo', 'Cairo fallback', sans-serif;
  font-weight: 800;
  font-size: 1.25rem;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}

.brand .brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1rem;
  flex-shrink: 0;
}

/* شعار أفق داخل الهيدر: أبعاد ثابتة (40×40) حتى لا يتمدد الهيدر عند
   تحميل الصورة (319×319 أصلًا) — يمنع CLS. مطابق لقاعدة style.css. */
.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  object-fit: contain;
  flex-shrink: 0;
  padding: 2px;
}

.header-nav {
  font-size: .9rem;
  opacity: .9;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-btn {
  background: rgba(255, 255, 255, .15);
  border: none;
  color: #fff;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  font-size: 1.05rem;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background var(--dur-micro), color var(--dur-micro);
}
.icon-btn .icon {
  width: 20px;
  height: 20px;
  display: block;
}
.icon-btn:hover { background: rgba(255, 255, 255, .28); }

/* حالة "الحساب مرتبط بـGoogle" فقط — #account-trigger يتحول من دائرة
   ثابتة 44x44 (أيقونة واحدة) إلى حبة (pill) بعرض تلقائي تحتوي صورة
   الحساب + الاسم. لا تغيير على .icon-btn الأساسية (تبقى كما هي لبقية
   الأزرار وللحساب في حالة الضيف). */
.icon-btn.account-linked {
  width: auto;
  padding-inline: 6px 14px;
  gap: 8px;
}
.account-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}
.account-name {
  font-size: .85rem;
  max-width: 110px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* -------------------- المحتوى الأساسي -------------------- */

main {
  flex: 1;
  max-width: var(--container-max);
  width: 100%;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

/* -------------------- Breadcrumb (مسار التنقّل) -------------------- */

.breadcrumb {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: .88rem;
  color: var(--ink-soft);
  margin-bottom: 22px;
  min-height: 34px;
}

.breadcrumb a {
  padding: 4px 10px;
  border-radius: var(--radius-full);
  background: var(--surface);
  border: 1px solid var(--line);
  transition: background var(--dur-micro), color var(--dur-micro);
}

.breadcrumb a:hover { background: var(--primary); color: #fff; }

.breadcrumb .sep { color: var(--line-strong); }

.breadcrumb .current {
  padding: 4px 10px;
  color: var(--primary-dark);
  font-weight: 700;
}

/* طيّ (collapse) العقد الوسطى للسلاسل الطويلة على الشاشات الضيقة:
   تُخفى العقد/الفاصلات الوسطى، ويظهر مؤشر "…" ناقل بصريًا إلى الجزء
   الأخير من المسار. في DOM يبقى كل شيء كما هو — إخفاء CSS فقط. */
.breadcrumb .bc-ellipsis {
  display: none;
}

@media (max-width: 560px) {
  .breadcrumb .mid,
  .breadcrumb .mid-sep {
    display: none;
  }
  .breadcrumb .bc-ellipsis {
    display: inline-flex;
    align-items: center;
    padding: 0 4px;
    color: var(--ink-soft);
  }
}

/* -------------------- صندوق البحث -------------------- */

.search-hero {
  background: var(--primary);
  border-bottom: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 40px 24px;
  box-shadow: var(--shadow-hover);
  margin-bottom: 32px;
  text-align: center;
}

.search-hero h1 {
  font-size: clamp(1.4rem, 3vw, 2rem);
  color: #fff;
}

.search-hero p {
  color: rgba(255, 255, 255, .85);
  margin-bottom: 24px;
}

.search-form {
  display: flex;
  gap: 6px;
  max-width: 560px;
  margin: 0 auto;
  background: var(--surface);
  padding: 6px;
  border-radius: 999px;
  box-shadow: var(--shadow);
}

.search-input {
  flex: 1;
  padding: 14px 18px;
  border: 2px solid var(--line);
  border-radius: 999px;
  font-family: 'Tajawal', 'Tajawal fallback', sans-serif;
  font-size: 1rem;
  background: var(--muted-bg);
  color: var(--ink);
}

.search-input:focus { border-color: var(--primary); outline: none; }

/* داخل الـHero فقط: الحقل يندمج مع الكبسولة البيضاء المحيطة به بدل إطاره
   الافتراضي، دون أي تأثير على مربع البحث الشامل (.global-search-box) الذي
   يستخدم نفس صنف .search-input في مكان آخر من الموقع. */
.search-hero .search-input {
  background: transparent;
  border: 2px solid transparent;
}

.search-hero .search-input:focus {
  border-color: var(--primary);
}

/* ====================================================================
   الصفحة الرئيسية العامة — تجديد الواجهة (Homepage Premium Redesign)
   ====================================================================
   كل ما يلي مخصّص حصريًا لعناصر index.html (بادئة home-) ولا يمس أي
   صنف مشترك مع صفحات أخرى (.search-hero/.search-form/.search-input
   تبقى كما هي لصفحة النتائج search.html؛ .grid/.card/.resource-card
   تبقى كما هي في كل الموقع). الألوان والمسافات وأنصاف الأقطار كلها من
   نفس متغيرات الهوية الحالية (UI-3)، بلا لوحة ألوان جديدة. */

.home-hero {
  position: relative;
  overflow: hidden;
  background: var(--primary);
  border-bottom: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 44px 24px;
  box-shadow: var(--shadow-hover);
  margin-bottom: 40px;
}

/* توهّج زخرفي هادئ خلف المحتوى — CSS فقط، بلا أي صورة/أصل جديد،
   وبلا أي تأثير على قابلية القراءة (فوق طبقته مباشرة). */
.home-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: var(--z-base);
  background:
    radial-gradient(480px 320px at 88% -10%, rgba(201, 165, 103, .16), transparent 70%),
    radial-gradient(420px 300px at -10% 110%, rgba(255, 255, 255, .05), transparent 70%);
}

.home-hero-inner {
  position: relative;
  z-index: var(--z-content);
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
  align-items: start;
}

.home-hero-content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
}

.home-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 16px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .1);
  border: 1px solid rgba(255, 255, 255, .16);
  color: rgba(255, 255, 255, .92);
  font-size: .78rem;
  font-weight: 700;
}

.home-eyebrow-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(201, 165, 103, .22);
  flex-shrink: 0;
}

.home-hero h1 {
  color: #fff;
  font-size: clamp(1.9rem, 1.15rem + 3.2vw, 3.1rem);

/* -------------------- الأزرار -------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 13px 22px;
  border-radius: 999px;
  border: none;
  font-family: 'Tajawal', 'Tajawal fallback', sans-serif;
  font-weight: 700;
  font-size: .95rem;
  cursor: pointer;
  transition: transform var(--dur-micro), box-shadow var(--dur-micro), background var(--dur-micro);
}

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:active { transform: scale(.98); }

.btn-outline {
  background: transparent;
  border: 2px solid var(--primary);
  color: var(--primary);
}
.btn-outline:hover { background: var(--muted-bg); border-color: var(--primary-dark); color: var(--primary-dark); }

.btn-danger {
  background: var(--danger);
  color: #fff;
  border: 2px solid var(--danger);
  box-shadow: 0 1px 4px rgba(192, 57, 43, .3);
}
.btn-danger:hover { filter: brightness(1.1); }

.btn-sm { padding: 8px 14px; font-size: .82rem; min-height: 44px; }

/* UX-02: حالة معطّل واضحة بصريًا لأزرار النماذج أثناء الإرسال (وبقية
   أزرار الإجراءات المحمية من الإرسال المزدوج) — عرض فقط، بلا منطق. */
.btn:disabled,
.btn[disabled] {
  opacity: .55;
  cursor: not-allowed;
  transform: none;
  filter: none;
}

/* -------------------- روابط التنقّل الظاهرة في الهيدر (UI-2) -------------------- */
/* بنفس نمط "الحبة/Pill" المستخدم أصلًا في breadcrumb — امتداد للغة
   البصرية الحالية، بلا مكوّن جديد. */
.header-nav {

  align-items: center;
  gap: 8px;
}

.header-nav .nav-link {

  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: rgba(255, 255, 255, .12);
  color: #fff;
  font-size: .85rem;
  font-weight: 700;
  white-space: nowrap;
  transition: background var(--dur-micro);
}

.header-nav .nav-link:hover,
.header-nav .nav-link:focus-visible {

}

/* -------------------- الهيرو -------------------- */
/* بنية غير متماثلة: نص الهوية يقابله رسم "الأفق" — خط ذهبي رفيع
   وحلقات متقاربة نحو مركز مضيء، تجسيد بصري حرفي لاسم المنصة ولفكرة
   "تضييق مصادر كثيرة إلى مورد واحد محدد" — لا رسم زخرفي عام. */

.landing-hero {
  position: relative;
  overflow: hidden;
  background: var(--primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-hover);
  padding: 40px 22px;
  margin-bottom: 64px;
}

.landing-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: var(--z-base);
  background: radial-gradient(560px 360px at 100% 0%, rgba(255, 255, 255, .05), transparent 65%);
}

.landing-hero-inner {
  position: relative;
  z-index: var(--z-content);
  display: grid;
  grid-template-columns: 1fr;
  gap: 36px;
  align-items: center;
}

.landing-hero-text {

  align-items: flex-start;
  gap: 18px;
}

.landing-eyebrow {

  border: 1px solid rgba(255, 255, 255, .16);
  color: rgba(255, 255, 255, .92);
  font-size: .78rem;
  font-weight: 700;
}

.landing-eyebrow-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(201, 165, 103, .22);
  flex-shrink: 0;
}

.landing-hero-title {
  color: #fff;
  font-size: clamp(1.85rem, 1.2rem + 2.8vw, 2.9rem);
  line-height: 1.22;
  margin: 0;
  max-width: 15ch;
}

.landing-hero-lead {
  color: rgba(255, 255, 255, .82);
  font-size: clamp(1rem, .93rem + .25vw, 1.1rem);
  line-height: 1.75;
  max-width: 44ch;
  margin: 0;
}

.landing-cta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 18px;
  margin-top: 6px;
}

.landing-cta-btn { min-height: 44px; padding-inline: 26px; }

.landing-secondary-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  color: rgba(255, 255, 255, .82);
  font-weight: 700;
  font-size: .9rem;
  border-bottom: 1px solid rgba(255, 255, 255, .3);

}

.landing-secondary-link:hover,
.landing-secondary-link:focus-visible {
  color: #fff;
  border-color: #fff;
}

.landing-secondary-link span { display: inline-block; transition: transform var(--dur-micro); }
.landing-secondary-link:hover span { transform: translateY(3px); }

/* -------------------- رسم "الأفق": حلقات متقاربة فوق خط الأفق -------------------- */
/* (منسوخة من style.css — ضرورية حتى يتطابق العرض الأولي مع العرض النهائي
   فلا يحدث CLS عند تطبيق style.css لاحقًا) */

.landing-horizon {
  position: relative;
  z-index: var(--z-content);
  height: 220px;
  border-radius: var(--radius-sm);
}

.landing-horizon-rings {
  position: absolute;
  inset-inline-start: 50%;
  top: 38%;
  width: 0;
  height: 0;
}

.landing-horizon-rings .ring {
  position: absolute;
  top: 0; left: 0;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(201, 165, 103, .38);
}

.ring-1 { width: 260px; height: 260px; }
.ring-2 { width: 195px; height: 195px; border-color: rgba(201, 165, 103, .5); }
.ring-3 { width: 132px; height: 132px; border-color: rgba(201, 165, 103, .65); }
.ring-4 { width: 74px; height: 74px; border-color: rgba(201, 165, 103, .85); }

.landing-horizon-core {
  position: absolute;
  top: 0; left: 0;
  width: 16px;
  height: 16px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 10px rgba(201, 165, 103, .18), 0 0 40px 6px rgba(201, 165, 103, .35);
}

.landing-horizon-line {
  position: absolute;
  inset-inline: 4%;
  top: 66%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201, 165, 103, .55) 18%, rgba(201, 165, 103, .55) 82%, transparent);
}

.landing-horizon-label {
  position: absolute;
  font-size: .74rem;
  font-weight: 700;
  color: rgba(255, 255, 255, .72);
  white-space: nowrap;
}

.landing-horizon-label-outer { top: 4%; inset-inline-end: 6%; }
.landing-horizon-label-inner { top: 40%; inset-inline-start: 50%; transform: translate(-50%, 26px); color: rgba(255,255,255,.92); }

.landing-horizon--simple .ring-1,
.landing-horizon--simple .ring-2,
.landing-horizon--simple .landing-horizon-label { display: none; }

/* -------------------- استجابة صفحة الهبوط (من قسم Responsive في style.css) -------------------- */

@media (min-width: 900px) {
  .landing-hero { padding: 64px 56px; }
  .landing-hero-inner { grid-template-columns: 1.2fr .8fr; gap: 48px; }
  .landing-hero-title { max-width: 13ch; }
  .landing-about-row { flex-direction: row; gap: 32px; }
  .landing-about-row h3 { flex: 0 0 220px; margin: 0; }
  .landing-about-row-body { flex: 1; min-width: 0; }
  .landing-provides-grid { grid-template-columns: 1.3fr .9fr; }
  .landing-flow-step { padding: 18px 4px; }
  .landing-cta-band .landing-hero-inner { grid-template-columns: 1fr; }
  .landing-impact-flow { flex-direction: row; align-items: stretch; }
  .landing-impact-step { flex: 1; flex-direction: column; text-align: center; gap: 8px; }
  .landing-impact-arrow { transform: none; }
}

@media (max-width: 560px) {
  .landing-hero { padding: 30px 16px; margin-bottom: 48px; }
  .landing-horizon { height: 150px; }
  .ring-1, .ring-2 { display: none; }
  .landing-horizon-label-outer { display: none; }
  .landing-section { margin-bottom: 56px; }
  .landing-cta-row { flex-direction: column; align-items: stretch; }
  .landing-cta-btn { width: 100%; }
  .landing-secondary-link { justify-content: center; }
  .landing-why { padding-inline-start: 18px; }
}

/* -------------------- استجابة حرجة (من قسم Responsive في style.css) -------------------- */

@media (min-width: 720px) {
  .search-hero { padding: 40px; }
}

@media (max-width: 480px) {
  .search-form { flex-direction: column; border-radius: var(--radius); }
  main { padding: 20px 14px 50px; }
  .site-header .header-inner { flex-direction: column; align-items: flex-start; gap: 8px; }
  /* على الشاشات الصغيرة جدًا نُبقي أزرار الأيقونات فقط (بلا نص ظاهر) لتفادي
     ازدحام صف الهيدر — الوصول لنفس الوجهة يبقى ممكنًا عبر الأيقونات نفسها
     (كل أيقونة تحمل aria-label بالفعل). */
  .header-nav .nav-link { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ============================================================
   AFOQ — Font metric overrides (PageSpeed CLS fix)
   ------------------------------------------------------------
   عائلات احتياطية تُعرض بمقاييس الخط الأصلي (ascent/descent/lineGap)
   حتى لا يتزحزح التخطيط عند تبديل الخط (font swap). تُستخدم أثناء
   تحميل Cairo/Tajawal ثم يُستبدل بها الخط الأصلي بلا إزاحة.
   size-adjust معايرة تجريبيًا (نسب عرض فعلية لعناصر الصفحة):
   - Cairo: 103% (لموازنة عرض النص ووحدة ch — يمنع إعادة الالتفاف)
   - Tajawal 400: 100% (Tajawal أعرض قليلًا من البديل — لا خطر)
   - Tajawal 500/700: 101%
   ============================================================ */
@font-face {
  font-family: "Cairo fallback";
  src: local("Segoe UI"), local("Roboto"), local("Helvetica Neue"), local("Cantarell"), local("Ubuntu"), local("Noto Sans");
  size-adjust: 103%;
  ascent-override: 126.5%;
  descent-override: 55.4%;
  line-gap-override: 0%;
  font-weight: 600;
}

@font-face {
  font-family: "Cairo fallback";
  src: local("Segoe UI"), local("Roboto"), local("Helvetica Neue"), local("Cantarell"), local("Ubuntu"), local("Noto Sans");
  size-adjust: 103%;
  ascent-override: 126.5%;
  descent-override: 55.4%;
  line-gap-override: 0%;
  font-weight: 700;
}

@font-face {
  font-family: "Cairo fallback";
  src: local("Segoe UI"), local("Roboto"), local("Helvetica Neue"), local("Cantarell"), local("Ubuntu"), local("Noto Sans");
  size-adjust: 103%;
  ascent-override: 126.5%;
  descent-override: 55.4%;
  line-gap-override: 0%;
  font-weight: 800;
}

@font-face {
  font-family: "Tajawal fallback";
  src: local("Segoe UI"), local("Roboto"), local("Helvetica Neue"), local("Cantarell"), local("Ubuntu"), local("Noto Sans");
  size-adjust: 100%;
  ascent-override: 64.3%;
  descent-override: 35.7%;
  line-gap-override: 20%;
  font-weight: 400;
}

@font-face {
  font-family: "Tajawal fallback";
  src: local("Segoe UI"), local("Roboto"), local("Helvetica Neue"), local("Cantarell"), local("Ubuntu"), local("Noto Sans");
  size-adjust: 101%;
  ascent-override: 63.7%;
  descent-override: 35.3%;
  line-gap-override: 19.8%;
  font-weight: 500;
}

@font-face {
  font-family: "Tajawal fallback";
  src: local("Segoe UI"), local("Roboto"), local("Helvetica Neue"), local("Cantarell"), local("Ubuntu"), local("Noto Sans");
  size-adjust: 101%;
  ascent-override: 63.7%;
  descent-override: 35.3%;
  line-gap-override: 19.8%;
  font-weight: 700;
}

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js" integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV" crossorigin="anonymous"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
const courseId = getQueryParam("id");

  async function loadCoursePage() {
    const container = document.getElementById("course-detail");

    if (!courseId) {
      renderState(container, "لم يتم تحديد دورة. عد إلى صفحة الدورات.");
      return;
    }

    // RLS العامة تسمح فقط بقراءة الدورات المنشورة (status='published') —
    // .eq("status","published") هنا زيادة وضوح على مستوى العميل فقط،
    // وليست هي خط الدفاع الفعلي (ذلك من مسؤولية السياسة في القاعدة).
    const { data: course, error } = await supabaseClient
      .from("courses")
      .select("id, title, short_description, description, cover_image_url, instructor_name, language")
      .eq("id", courseId)
      .eq("status", "published")
      .single();

    if (error || !course) {
      renderState(container, "لم يتم العثور على هذه الدورة، أو أنها غير منشورة بعد.");
      return;
    }

    document.title = `${course.title} — أفق المعرفة`;
    document.getElementById("meta-description").setAttribute("content", course.short_description || course.title);
    document.getElementById("og-title").setAttribute("content", `${course.title} — أفق المعرفة`);
    document.getElementById("og-description").setAttribute("content", course.short_description || course.title);
    document.getElementById("twitter-title").setAttribute("content", `${course.title} — أفق المعرفة`);
    document.getElementById("twitter-description").setAttribute("content", course.short_description || course.title);
    if (course.cover_image_url) {
      const safeCover = safeResourceUrl(course.cover_image_url);
      if (safeCover !== "#") {
        document.getElementById("og-image").setAttribute("content", safeCover);
        document.getElementById("twitter-image").setAttribute("content", safeCover);
      }
    }

    renderBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "الرئيسية", href: "index.html" },
      { label: "الدورات", href: "courses.html" },
      { label: course.title },
    ]);

    container.innerHTML = "";

    if (course.cover_image_url) {
      const safeCover = safeResourceUrl(course.cover_image_url);
      if (safeCover !== "#") {
        const img = document.createElement("img");
        img.src = safeCover;
        img.alt = "";
        img.className = "course-detail-cover";
        container.appendChild(img);
      }
    }

    const h1 = document.createElement("h1");
    h1.id = "page-title";
    h1.textContent = course.title;
    container.appendChild(h1);

    const meta = document.createElement("div");
    meta.className = "resource-meta";
    if (course.instructor_name) {
      const instructorTag = document.createElement("span");
      instructorTag.className = "tag";
      instructorTag.textContent = course.instructor_name;
      meta.appendChild(instructorTag);
    }
    if (course.language) {
      const langTag = document.createElement("span");
      langTag.className = "tag tag-lang";
      langTag.textContent = LANGUAGE_LABELS[course.language] || course.language;
      meta.appendChild(langTag);
    }
    if (meta.childNodes.length) container.appendChild(meta);

    if (course.description) {
      const desc = document.createElement("p");
      desc.className = "landing-provides-text";
      desc.textContent = course.description;
      container.appendChild(desc);
    }

    const lessonsHeading = document.createElement("h2");
    lessonsHeading.textContent = "الدروس";
    lessonsHeading.style.marginTop = "24px";
    container.appendChild(lessonsHeading);

    const lessonsWrap = document.createElement("div");
    lessonsWrap.id = "lessons-list";
    lessonsWrap.className = "lesson-rows";
    lessonsWrap.setAttribute("role", "list");
    container.appendChild(lessonsWrap);

    await loadLessons(course.id, lessonsWrap);
  }

  async function loadLessons(courseId, wrap) {
    // RLS العامة تسمح فقط بدروس منشورة تابعة لدورة منشورة — نفس الملاحظة
    // أعلاه بخصوص .eq("status","published") هنا (وضوح فقط، لا فرض أمني).
    const { data: lessons, error } = await supabaseClient
      .from("course_lessons")
      .select("id, title, content_type, content_url, content_text, duration_minutes, sort_order")
      .eq("course_id", courseId)
      .eq("status", "published")
      .order("sort_order", { ascending: true })
      .order("created_at", { ascending: true });

    if (error) {
      console.error(error);
      renderState(wrap, "تعذّر تحميل دروس هذه الدورة.");
      return;
    }

    if (!lessons || lessons.length === 0) {
      renderState(wrap, "لا توجد دروس منشورة لهذه الدورة بعد.");
      return;
    }

    lessons.forEach((lesson, index) => {
      wrap.appendChild(buildLessonCard(lesson, index + 1));
    });
  }

  // G-05: أيقونة SVG دلالية حسب نوع الدرس الفعلي (text / video_url / link)
  // بنمط lucide (stroke 1.8) مطابق لنظام الأيقونات. القالب ثابت من تأليفنا
  // فلا تمر عليه بيانات مستخدم. الأيقونة زخرفية (aria-hidden) لأن العنوان
  // النصي المجاور يحمل المعنى — لا نجعل SVG وحده مصدر المعنى.
  function lessonTypeIconMarkup(contentType) {
    const paths =
      contentType === "video_url"
        ? '<path d="m7 4 13 8-13 8V4z"/>'
        : contentType === "text"
        ? '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/>'
        : '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>';
    return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">${paths}</svg>`;
  }

  function buildLessonCard(lesson, orderNumber) {
    const card = document.createElement("div");
    card.className = "resource-card lesson-card";
    card.setAttribute("role", "listitem");

    const title = document.createElement("div");
    title.className = "resource-title";
    const titleIcon = document.createElement("span");
    titleIcon.className = "lesson-type-icon";
    titleIcon.setAttribute("aria-hidden", "true");
    titleIcon.innerHTML = lessonTypeIconMarkup(lesson.content_type);
    title.appendChild(titleIcon);
    title.appendChild(document.createTextNode(`${orderNumber}. ${lesson.title}`));
    card.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "resource-meta";
    if (lesson.duration_minutes != null) {
      const durationTag = document.createElement("span");
      durationTag.className = "tag";
      durationTag.textContent = `${lesson.duration_minutes} دقيقة`;
      meta.appendChild(durationTag);
    }
    card.appendChild(meta);

    if (lesson.content_type === "text") {
      const textBody = document.createElement("p");
      textBody.className = "lesson-text-content";
      textBody.textContent = lesson.content_text || "";
      card.appendChild(textBody);
    } else {
      const actions = document.createElement("div");
      actions.className = "resource-actions";
      const link = document.createElement("a");
      link.className = "btn btn-primary btn-sm";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.href = safeResourceUrl(lesson.content_url);
      link.textContent = lesson.content_type === "video_url" ? "مشاهدة الفيديو ↗" : "فتح الرابط ↗";
      actions.appendChild(link);
      card.appendChild(actions);
    }

    return card;
  }

  loadCoursePage();

});
</script>
