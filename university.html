<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const universityId = getQueryParam("id");

  async function loadUniversityPage() {
    const grid = document.getElementById("faculties-grid");

    if (!universityId) {
      renderState(grid, "لم يتم تحديد جامعة. عد إلى الصفحة الرئيسية.");
      return;
    }

    const { data: uni, error: uniError } = await supabaseClient
      .from("universities")
      .select("id, name")
      .eq("id", universityId)
      .single();

    if (uniError || !uni) {
      renderState(grid, "لم يتم العثور على هذه الجامعة.");
      return;
    }

    document.title = `${uni.name} — أفق المعرفة`;
    document.getElementById("page-title").textContent = `الكليات — ${uni.name}`;
    renderBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "الرئيسية", href: "index.html" },
      { label: uni.name },
    ]);

    const { data: faculties, error: facultiesError } = await supabaseClient
      .from("faculties")
      .select("id, name, code, description")
      .eq("university_id", universityId)
      .eq("is_active", true)
      .order("name", { ascending: true });

    if (facultiesError) {
      console.error(facultiesError);
      renderState(grid, "تعذّر تحميل الكليات.");
      return;
    }

    if (!faculties || faculties.length === 0) {
      renderState(grid, "لا توجد كليات مضافة لهذه الجامعة بعد.");
      return;
    }

    grid.innerHTML = "";
    faculties.forEach((f) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `faculty.html?id=${f.id}`;
      a.innerHTML = `
        <div class="card-icon">${escHtml(f.name.slice(0, 2))}</div>
        <h3>${escHtml(f.name)}</h3>
        <div class="card-sub">${f.code ? "رمز الكلية: " + escHtml(f.code) : "عرض السنوات الدراسية"}</div>
      `;
      grid.appendChild(a);
    });
  }

  loadUniversityPage();
</script>
