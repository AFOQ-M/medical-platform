<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكليات — منصة الموارد الطبية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">طب</span>
      منصة الموارد الطبية
    </a>
    <nav class="header-nav">مجانية بالكامل لطلاب الطب</nav>
  </div>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>

  <h1 id="page-title">الكليات</h1>
  <div id="faculties-grid" class="grid">
    <div class="state-msg">جارٍ التحميل...</div>
  </div>
</main>

<footer class="site-footer">
  منصة مجانية غير هادفة للربح لطلاب الطب — لا تستضيف محتوى محمي بحقوق نشر مباشرة
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  const universityId = getQueryParam("id");

  async function loadUniversityPage() {
    const grid = document.getElementById("faculties-grid");

    if (!universityId) {
      renderState(grid, "لم يتم تحديد جامعة. عد إلى الصفحة الرئيسية.");
      return;
    }

    const { data: uni, error: uniError } = await supabaseClient
      .from("universities")
      .select("id, name")
      .eq("id", universityId)
      .single();

    if (uniError || !uni) {
      renderState(grid, "لم يتم العثور على هذه الجامعة.");
      return;
    }

    document.title = `${uni.name} — منصة الموارد الطبية`;
    document.getElementById("page-title").textContent = `الكليات — ${uni.name}`;
    renderBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "الرئيسية", href: "index.html" },
      { label: uni.name },
    ]);

    const { data: faculties, error: facultiesError } = await supabaseClient
      .from("faculties")
      .select("id, name, code, description")
      .eq("university_id", universityId)
      .eq("is_active", true)
      .order("name", { ascending: true });

    if (facultiesError) {
      console.error(facultiesError);
      renderState(grid, "تعذّر تحميل الكليات.");
      return;
    }

    if (!faculties || faculties.length === 0) {
      renderState(grid, "لا توجد كليات مضافة لهذه الجامعة بعد.");
      return;
    }

    grid.innerHTML = "";
    faculties.forEach((f) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `faculty.html?id=${f.id}`;
      a.innerHTML = `
        <div class="card-icon">${f.name.slice(0, 2)}</div>
        <h3>${f.name}</h3>
        <div class="card-sub">${f.code ? "رمز الكلية: " + f.code : "عرض السنوات الدراسية"}</div>
      `;
      grid.appendChild(a);
    });
  }

  loadUniversityPage();
</script>
</body>
</html>
