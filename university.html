<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السنوات الدراسية — منصة الموارد الطبية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">طب</span>
      منصة الموارد الطبية
    </a>
    <nav class="header-nav">مجانية بالكامل لطلاب الطب</nav>
  </div>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>

  <h1 id="page-title">السنوات الدراسية</h1>
  <div id="years-grid" class="grid">
    <div class="state-msg">جارٍ التحميل...</div>
  </div>
</main>

<footer class="site-footer">
  منصة مجانية غير هادفة للربح لطلاب الطب — لا تستضيف محتوى محمي بحقوق نشر مباشرة
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  const universityId = getQueryParam("id");

  async function loadUniversityPage() {
    const grid = document.getElementById("years-grid");

    if (!universityId) {
      renderState(grid, "لم يتم تحديد جامعة. عد إلى الصفحة الرئيسية.");
      return;
    }

    const { data: uni, error: uniError } = await supabaseClient
      .from("universities")
      .select("id, name")
      .eq("id", universityId)
      .single();

    if (uniError || !uni) {
      renderState(grid, "لم يتم العثور على هذه الجامعة.");
      return;
    }

    document.title = `${uni.name} — منصة الموارد الطبية`;
    document.getElementById("page-title").textContent = `السنوات الدراسية — ${uni.name}`;
    renderBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "الرئيسية", href: "index.html" },
      { label: uni.name },
    ]);

    const { data: years, error: yearsError } = await supabaseClient
      .from("years")
      .select("id, year_number")
      .eq("university_id", universityId)
      .order("year_number", { ascending: true });

    if (yearsError) {
      console.error(yearsError);
      renderState(grid, "تعذّر تحميل السنوات الدراسية.");
      return;
    }

    if (!years || years.length === 0) {
      renderState(grid, "لا توجد سنوات دراسية مضافة لهذه الجامعة بعد.");
      return;
    }

    grid.innerHTML = "";
    years.forEach((y) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `year.html?id=${y.id}`;
      a.innerHTML = `
        <div class="year-badge">${y.year_number}</div>
        <h3>السنة ${y.year_number}</h3>
        <div class="card-sub">عرض المواد الدراسية</div>
      `;
      grid.appendChild(a);
    });
  }

  loadUniversityPage();
</script>
</body>
</html>
