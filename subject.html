<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموارد — منصة الموارد الطبية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">طب</span>
      منصة الموارد الطبية
    </a>
    <div class="header-actions">
      <nav class="header-nav"></nav>
      <button type="button" class="icon-btn" id="global-search-trigger" aria-label="بحث">🔍</button>
      <a href="favorites.html" class="icon-btn" aria-label="المفضلة">★</a>
    </div>
  </div>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>

  <h1 id="page-title">الموارد</h1>

  <div class="resource-toolbar" id="resource-toolbar" hidden>
    <div class="resource-count" id="resource-count"></div>
    <div class="type-tabs" id="type-tabs"></div>
    <input type="search" id="subject-search-input" class="subject-search-input" placeholder="🔍 ابحث داخل هذه المادة...">
  </div>

  <div id="resources-grid" class="grid">
    <div class="state-msg">جارٍ التحميل...</div>
  </div>
</main>

<footer class="site-footer">
</footer>

<div class="modal-overlay" id="report-modal" hidden>
  <div class="modal-box">
    <h3>الإبلاغ عن مشكلة</h3>
    <p class="hint">المورد: <strong id="report-resource-name"></strong></p>
    <form id="report-form">
      <div class="field">
        <label for="report-reason">نوع المشكلة</label>
        <select id="report-reason" required>
          <option value="broken_link">الرابط لا يعمل</option>
          <option value="wrong_file">الملف غير صحيح</option>
          <option value="copyright">محتوى محمي بحقوق نشر</option>
          <option value="other">أخرى</option>
        </select>
      </div>
      <div class="field">
        <label for="report-note">ملاحظات إضافية (اختياري)</label>
        <textarea id="report-note" placeholder="اكتب تفاصيل المشكلة هنا..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" id="report-submit-btn" class="btn btn-primary">إرسال البلاغ</button>
        <button type="button" id="report-cancel-btn" class="btn btn-outline">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  const subjectId = getQueryParam("id");

  async function loadSubjectPage() {
    const grid = document.getElementById("resources-grid");

    if (!subjectId) {
      renderState(grid, "لم يتم تحديد مادة. عد إلى الصفحة الرئيسية.");
      return;
    }

    const { data: subject, error: subjectError } = await supabaseClient
      .from("subjects")
      .select("id, name, year_id, years(id, year_number, university_id, faculty_id, universities(id, name), faculties(id, name))")
      .eq("id", subjectId)
      .single();

    if (subjectError || !subject) {
      renderState(grid, "لم يتم العثور على هذه المادة.");
      return;
    }

    const year = subject.years;
    const uni = year?.universities;
    const fac = year?.faculties;
    document.title = `${subject.name} — منصة الموارد الطبية`;
    document.getElementById("page-title").textContent = subject.name;
    renderBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "الرئيسية", href: "index.html" },
      { label: uni?.name || "", href: `university.html?id=${uni?.id}` },
      { label: fac?.name || "الكلية", href: fac?.id ? `faculty.html?id=${fac.id}` : undefined },
      { label: `السنة ${year?.year_number}`, href: `year.html?id=${year?.id}` },
      { label: subject.name },
    ]);

    const { data: resources, error: resError } = await supabaseClient
      .from("resources")
      .select("id, title, type, language, file_url, source_type, status, keywords, subject_id, verified")
      .eq("subject_id", subjectId)
      .eq("status", "published")
      .order("created_at", { ascending: false });

    if (resError) {
      console.error(resError);
      renderState(grid, "تعذّر تحميل الموارد.");
      return;
    }

    if (!resources || resources.length === 0) {
      renderState(grid, "لا توجد موارد منشورة لهذه المادة بعد.");
      return;
    }

    // نُغني كل مورد بسياقه الأكاديمي (مادة/كلية/جامعة) قبل بناء البطاقات، حتى تُحفظ هذه
    // المعلومات في المفضلة/"آخر ما شوهد" بغضّ النظر عن الصفحة التي أُضيف منها المورد.
    resources.forEach((r) => {
      r.subject_name = subject.name;
      r.faculty_name = fac?.name || null;
      r.university_name = uni?.name || null;
    });

    grid.style.gridTemplateColumns = "1fr";
    setupResourceToolbar(resources);
  }

  // -------------------- شريط الأدوات: تبويبات النوع + بحث داخلي (Phase 3.1) --------------------
  // كل الفلترة تتم محليًا على القائمة المحمَّلة مسبقًا (بدون أي طلب شبكة إضافي).

  let selectedType = "all";
  let searchText = "";

  function setupResourceToolbar(resources) {
    const toolbar = document.getElementById("resource-toolbar");
    const tabsEl = document.getElementById("type-tabs");
    const searchInput = document.getElementById("subject-search-input");

    toolbar.hidden = false;
    tabsEl.innerHTML = "";

    const presentTypes = RESOURCE_TYPE_ORDER.filter((t) => resources.some((r) => r.type === t));

    const allBtn = document.createElement("button");
    allBtn.type = "button";
    allBtn.className = "type-tab-btn active";
    allBtn.textContent = `الكل (${resources.length})`;
    allBtn.dataset.type = "all";
    tabsEl.appendChild(allBtn);

    presentTypes.forEach((type) => {
      const count = resources.filter((r) => r.type === type).length;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "type-tab-btn";
      btn.dataset.type = type;
      btn.style.setProperty("--tab-color", `var(--type-${type})`);
      btn.textContent = `${RESOURCE_TYPE_ICONS[type] || ""} ${RESOURCE_TYPE_LABELS[type] || type} (${count})`;
      tabsEl.appendChild(btn);
    });

    tabsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".type-tab-btn");
      if (!btn) return;
      selectedType = btn.dataset.type;
      tabsEl.querySelectorAll(".type-tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
      renderFilteredResources(resources);
    });

    let debounceTimer = null;
    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        searchText = searchInput.value.trim().toLowerCase();
        renderFilteredResources(resources);
      }, 150);
    });

    renderFilteredResources(resources);
  }

  function renderFilteredResources(resources) {
    const grid = document.getElementById("resources-grid");
    const countEl = document.getElementById("resource-count");

    const filtered = resources.filter((r) => {
      const matchesType = selectedType === "all" || r.type === selectedType;
      const matchesSearch = !searchText ||
        r.title.toLowerCase().includes(searchText) ||
        (r.keywords || "").toLowerCase().includes(searchText);
      return matchesType && matchesSearch;
    });

    countEl.textContent = `${filtered.length} مورد`;

    if (filtered.length === 0) {
      renderState(grid, "لا توجد موارد مطابقة لبحثك/الفلتر الحالي.");
      return;
    }

    grid.innerHTML = "";
    filtered.forEach((r) => grid.appendChild(buildResourceCard(r)));
  }

  loadSubjectPage();
</script>
</body>
</html>
