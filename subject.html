<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموارد — منصة الموارد الطبية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">طب</span>
      منصة الموارد الطبية
    </a>
    <nav class="header-nav">مجانية بالكامل لطلاب الطب</nav>
  </div>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>

  <h1 id="page-title">الموارد</h1>
  <div id="resources-grid" class="grid">
    <div class="state-msg">جارٍ التحميل...</div>
  </div>
</main>

<footer class="site-footer">
  منصة مجانية غير هادفة للربح لطلاب الطب — لا تستضيف محتوى محمي بحقوق نشر مباشرة
</footer>

<div class="modal-overlay" id="report-modal" hidden>
  <div class="modal-box">
    <h3>الإبلاغ عن مشكلة</h3>
    <p class="hint">المورد: <strong id="report-resource-name"></strong></p>
    <form id="report-form">
      <div class="field">
        <label for="report-reason">نوع المشكلة</label>
        <select id="report-reason" required>
          <option value="broken_link">الرابط لا يعمل</option>
          <option value="wrong_file">الملف غير صحيح</option>
          <option value="copyright">محتوى محمي بحقوق نشر</option>
          <option value="other">أخرى</option>
        </select>
      </div>
      <div class="field">
        <label for="report-note">ملاحظات إضافية (اختياري)</label>
        <textarea id="report-note" placeholder="اكتب تفاصيل المشكلة هنا..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" id="report-submit-btn" class="btn btn-primary">إرسال البلاغ</button>
        <button type="button" id="report-cancel-btn" class="btn btn-outline">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  const subjectId = getQueryParam("id");

  async function loadSubjectPage() {
    const grid = document.getElementById("resources-grid");

    if (!subjectId) {
      renderState(grid, "لم يتم تحديد مادة. عد إلى الصفحة الرئيسية.");
      return;
    }

    const { data: subject, error: subjectError } = await supabaseClient
      .from("subjects")
      .select("id, name, year_id, years(id, year_number, university_id, universities(id, name))")
      .eq("id", subjectId)
      .single();

    if (subjectError || !subject) {
      renderState(grid, "لم يتم العثور على هذه المادة.");
      return;
    }

    const year = subject.years;
    const uni = year?.universities;
    document.title = `${subject.name} — منصة الموارد الطبية`;
    document.getElementById("page-title").textContent = subject.name;
    renderBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "الرئيسية", href: "index.html" },
      { label: uni?.name || "", href: `university.html?id=${uni?.id}` },
      { label: `السنة ${year?.year_number}`, href: `year.html?id=${year?.id}` },
      { label: subject.name },
    ]);

    const { data: resources, error: resError } = await supabaseClient
      .from("resources")
      .select("id, title, type, language, file_url, source_type, status")
      .eq("subject_id", subjectId)
      .eq("status", "published")
      .order("created_at", { ascending: false });

    if (resError) {
      console.error(resError);
      renderState(grid, "تعذّر تحميل الموارد.");
      return;
    }

    if (!resources || resources.length === 0) {
      renderState(grid, "لا توجد موارد منشورة لهذه المادة بعد.");
      return;
    }

    grid.innerHTML = "";
    grid.style.gridTemplateColumns = "1fr";
    resources.forEach((r) => grid.appendChild(buildResourceCard(r)));
  }

  loadSubjectPage();
</script>
</body>
</html>
