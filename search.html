<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائج البحث — منصة الموارد الطبية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">طب</span>
      منصة الموارد الطبية
    </a>
    <nav class="header-nav">مجانية بالكامل لطلاب الطب</nav>
  </div>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>

  <section class="search-hero">
    <h1>نتائج البحث</h1>
    <form class="search-form" action="search.html" method="get">
      <input class="search-input" type="search" name="q" id="search-input" placeholder="ابحث باسم المادة أو المورد أو الجامعة أو كلمات مفتاحية..." autocomplete="off">
      <button type="submit" class="btn btn-primary">بحث</button>
    </form>

    <div class="search-filters" id="search-filters">
      <select id="filter-type">
        <option value="">كل الأنواع</option>
        <option value="book">كتاب</option>
        <option value="lecture">محاضرة</option>
        <option value="slides">سلايدات</option>
        <option value="summary">ملخص</option>
        <option value="questions">أسئلة</option>
        <option value="past_exam">امتحان سابق</option>
        <option value="notes">ملاحظات</option>
      </select>
      <select id="filter-language">
        <option value="">كل اللغات</option>
        <option value="ar">عربي</option>
        <option value="en">إنجليزي</option>
      </select>
      <select id="filter-university">
        <option value="">كل الجامعات</option>
      </select>
      <select id="filter-year">
        <option value="">كل السنوات</option>
        <option value="1">سنة 1</option>
        <option value="2">سنة 2</option>
        <option value="3">سنة 3</option>
        <option value="4">سنة 4</option>
        <option value="5">سنة 5</option>
        <option value="6">سنة 6</option>
      </select>
    </div>
  </section>

  <div id="results" class="grid">
    <div class="state-msg">جارٍ البحث...</div>
  </div>
</main>

<footer class="site-footer">
  منصة مجانية غير هادفة للربح لطلاب الطب — لا تستضيف محتوى محمي بحقوق نشر مباشرة
</footer>

<div class="modal-overlay" id="report-modal" hidden>
  <div class="modal-box">
    <h3>الإبلاغ عن مشكلة</h3>
    <p class="hint">المورد: <strong id="report-resource-name"></strong></p>
    <form id="report-form">
      <div class="field">
        <label for="report-reason">نوع المشكلة</label>
        <select id="report-reason" required>
          <option value="broken_link">الرابط لا يعمل</option>
          <option value="wrong_file">الملف غير صحيح</option>
          <option value="copyright">محتوى محمي بحقوق نشر</option>
          <option value="other">أخرى</option>
        </select>
      </div>
      <div class="field">
        <label for="report-note">ملاحظات إضافية (اختياري)</label>
        <textarea id="report-note" placeholder="اكتب تفاصيل المشكلة هنا..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" id="report-submit-btn" class="btn btn-primary">إرسال البلاغ</button>
        <button type="button" id="report-cancel-btn" class="btn btn-outline">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  const query = (getQueryParam("q") || "").trim();
  document.getElementById("search-input").value = query;

  renderBreadcrumb(document.getElementById("breadcrumb"), [
    { label: "الرئيسية", href: "index.html" },
    { label: "نتائج البحث" },
  ]);

  async function loadUniversityFilterOptions() {
    const { data } = await supabaseClient.from("universities").select("id, name").order("name");
    const select = document.getElementById("filter-university");
    (data || []).forEach((u) => {
      const opt = document.createElement("option");
      opt.value = u.id;
      opt.textContent = u.name;
      select.appendChild(opt);
    });
  }

  async function runSearch() {
    const results = document.getElementById("results");
    const type = document.getElementById("filter-type").value || null;
    const language = document.getElementById("filter-language").value || null;
    const universityId = document.getElementById("filter-university").value || null;
    const yearNumber = document.getElementById("filter-year").value ? parseInt(document.getElementById("filter-year").value, 10) : null;

    if (!query && !type && !language && !universityId && !yearNumber) {
      renderState(results, "اكتب كلمة للبحث عنها أو اختر فلترًا.");
      return;
    }

    document.title = query ? `بحث: ${query} — منصة الموارد الطبية` : "نتائج البحث — منصة الموارد الطبية";
    renderState(results, "جارٍ البحث...");

    // بحث شامل عبر دالة search_resources في قاعدة البيانات:
    // يطابق العنوان + الكلمات المفتاحية + اسم/رمز المادة + اسم الجامعة
    const { data, error } = await supabaseClient.rpc("search_resources", {
      p_query: query || null,
      p_type: type,
      p_university_id: universityId,
      p_year_number: yearNumber,
      p_subject_id: null,
      p_language: language,
    });

    if (error) {
      console.error(error);
      renderState(results, "تعذّر إجراء البحث، حاول لاحقًا.");
      return;
    }

    if (!data || data.length === 0) {
      renderState(results, query ? `لا توجد نتائج مطابقة لـ "${query}".` : "لا توجد نتائج مطابقة للفلاتر المحددة.");
      return;
    }

    results.innerHTML = "";
    results.style.gridTemplateColumns = "1fr";
    data.forEach((r) => {
      const card = buildResourceCard(r);
      const metaLine = document.createElement("div");
      metaLine.className = "card-sub";
      metaLine.style.fontSize = ".82rem";
      metaLine.style.color = "var(--ink-soft)";
      metaLine.style.marginTop = "-6px";
      metaLine.style.marginBottom = "8px";
      const parts = [];
      if (r.subject_name) parts.push(`مادة: ${r.subject_name}`);
      if (r.university_name) parts.push(`جامعة: ${r.university_name}`);
      if (r.year_number) parts.push(`سنة ${r.year_number}`);
      metaLine.textContent = parts.join(" · ");
      card.insertBefore(metaLine, card.querySelector(".resource-actions"));
      if (r.subject_id) {
        const subLink = document.createElement("a");
        subLink.href = `subject.html?id=${r.subject_id}`;
        subLink.className = "card-sub";
        subLink.style.textDecoration = "underline";
        subLink.style.display = "block";
        subLink.style.marginBottom = "8px";
        subLink.textContent = "عرض المادة كاملة →";
        card.insertBefore(subLink, card.querySelector(".resource-actions"));
      }
      results.appendChild(card);
    });
  }

  document.querySelectorAll("#search-filters select").forEach((el) => {
    el.addEventListener("change", runSearch);
  });

  loadUniversityFilterOptions().then(runSearch);
</script>
</body>
</html>
