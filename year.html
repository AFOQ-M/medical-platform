<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js" integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV" crossorigin="anonymous"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
// G-10: year.html صفحة حقيقية لاختيار الفصل الدراسي، بدلًا من صفحة التوجيه.
  // الفصول ليست كيانات مستقلة في قاعدة البيانات — إنها طبقة عرض/فلترة مشتقة
  // من عمود subjects.semester (الاختياري)، فتُحسب هنا محليًا بنفس مصادر
  // semester.html تمامًا (SUBJECT_SEMESTER_ORDER / SUBJECT_SEMESTER_LABELS).
  // `?id=` القديم (روابط محفوظة منذ عصر التوجيه) يُعامَل كمرادف للـ year id
  // دون إعادة توجيه — فلا يُكسر أي رابط قديم ولا يوجد أي redirect loop.
  const yearParam = getQueryParam("year");
  const legacyYearId = getQueryParam("id");
  const yearId = yearParam || legacyYearId;

  async function loadYearPage() {
    const grid = document.getElementById("subjects-grid");
    const summaryEl = document.getElementById("semester-summary");

    if (!yearId) {
      renderState(grid, "لم يتم تحديد سنة دراسية. عد إلى الصفحة الرئيسية.");
      return;
    }

    // نفس استعلام سياق السنة المستخدم في semester.html (جامعة + كلية عبر العلاقة)
    // مع is_active=true لمنع الوصول المباشر لسنة معطَّلة عبر الرابط.
    const { data: year, error: yearError } = await supabaseClient
      .from("years")
      .select("id, year_number, university_id, faculty_id, universities(id, name), faculties(id, name)")
      .eq("id", yearId)
      .eq("is_active", true)
      .single();

    if (yearError || !year) {
      renderState(grid, "لم يتم العثور على هذه السنة الدراسية.");
      return;
    }

    const uni = year.universities?.name || "";
    const fac = year.faculties?.name || "";
    document.title = `اختيار الفصل الدراسي — السنة ${year.year_number} — ${fac || uni}`;
    document.getElementById("page-title").textContent = `السنة ${year.year_number} — ${fac || uni}`;
    renderBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "الرئيسية", href: "index.html" },
      { label: uni, href: `university.html?id=${year.university_id}` },
      { label: fac || "الكلية", href: year.faculty_id ? `faculty.html?id=${year.faculty_id}` : undefined },
      { label: `السنة ${year.year_number}` },
    ]);

    // نفس استعلام مواد السنة المستخدم في semester.html: نَشتق منها الفصول المتاحة.
    const { data: subjects, error: subjectsError } = await supabaseClient
      .from("subjects")
      .select("id, name, code, semester")
      .eq("year_id", yearId)
      .eq("is_active", true)
      .order("name", { ascending: true });

    if (subjectsError) {
      console.error(subjectsError);
      renderState(grid, "تعذّر تحميل المواد الدراسية.");
      return;
    }

    const list = subjects || [];
    if (list.length === 0) {
      renderState(grid, "لا توجد مواد مضافة لهذه السنة بعد.");
      return;
    }

    const semesters = SUBJECT_SEMESTER_ORDER
      .filter((sem) => list.some((s) => s.semester === sem))
      .map((sem) => ({
        key: sem,
        label: SUBJECT_SEMESTER_LABELS[sem],
        count: list.filter((s) => s.semester === sem).length,
      }));
    if (list.some((s) => !s.semester)) {
      semesters.push({
        key: "unspecified",
        label: "غير محدد",
        count: list.filter((s) => !s.semester).length,
      });
    }

    summaryEl.textContent = `${semesters.length} فصول متاحة`;

    grid.innerHTML = "";
    semesters.forEach((sem) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `semester.html?year=${encodeURIComponent(yearId)}&semester=${encodeURIComponent(sem.key)}`;
      a.innerHTML = `
        <div class="year-badge">${sem.count}</div>
        <h3>${escHtml(sem.label)}</h3>
        <div class="card-sub">عرض مواد الفصل</div>
      `;
      grid.appendChild(a);
    });
  }

  loadYearPage();

});
</script>
