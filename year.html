<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جارٍ التوجيه... — منصة الموارد الطبية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">طب</span>
      منصة الموارد الطبية
    </a>
    <div class="header-actions">
      <nav class="header-nav"></nav>
      <button type="button" class="icon-btn" id="global-search-trigger" aria-label="بحث">🔍</button>
      <button type="button" class="icon-btn" id="account-trigger" aria-label="الحساب">👤</button>
      <a href="favorites.html" class="icon-btn" aria-label="المفضلة">★</a>
    </div>
  </div>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>

  <h1 id="page-title">جارٍ التوجيه...</h1>
  <div id="subjects-grid" class="grid">
    <div class="state-msg">جارٍ التوجيه إلى صفحة اختيار الفصل الدراسي...</div>
  </div>
</main>

<footer class="site-footer">
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  // Phase 4B — Semester Navigation Level: year.html لم يعد يعرض المواد
  // مباشرة (نُقل ذلك بالكامل إلى semester.html). هذا الملف بقي موجودًا
  // فقط لعدم كسر أي رابط قديم/محفوظ يشير إلى year.html?id=<yearId>،
  // وهو يحوّل فورًا إلى semester.html?year=<yearId> بنفس معرّف السنة.
  const yearId = getQueryParam("id");

  if (yearId) {
    window.location.replace(`semester.html?year=${encodeURIComponent(yearId)}`);
  } else {
    renderState(
      document.getElementById("subjects-grid"),
      "لم يتم تحديد سنة دراسية. عد إلى الصفحة الرئيسية."
    );
  }
</script>
</body>
</html>
