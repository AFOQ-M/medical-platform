<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المواد الدراسية — منصة الموارد الطبية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">طب</span>
      منصة الموارد الطبية
    </a>
    <div class="header-actions">
      <nav class="header-nav">مجانية بالكامل لطلاب الطب</nav>
      <button type="button" class="icon-btn" id="global-search-trigger" aria-label="بحث">🔍</button>
      <a href="favorites.html" class="icon-btn" aria-label="المفضلة">★</a>
    </div>
  </div>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>

  <h1 id="page-title">المواد الدراسية</h1>
  <div id="subjects-grid" class="grid">
    <div class="state-msg">جارٍ التحميل...</div>
  </div>
</main>

<footer class="site-footer">
  منصة مجانية غير هادفة للربح لطلاب الطب — لا تستضيف محتوى محمي بحقوق نشر مباشرة
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  const yearId = getQueryParam("id");

  async function loadYearPage() {
    const grid = document.getElementById("subjects-grid");

    if (!yearId) {
      renderState(grid, "لم يتم تحديد سنة دراسية. عد إلى الصفحة الرئيسية.");
      return;
    }

    // نحمّل السياق الكامل (الجامعة والكلية) عبر العلاقة في قاعدة البيانات
    // مباشرة بدل تخمينه من حالة الواجهة، تمامًا كما هو مطلوب في الجزء الثاني.
    const { data: year, error: yearError } = await supabaseClient
      .from("years")
      .select("id, year_number, university_id, faculty_id, universities(id, name), faculties(id, name)")
      .eq("id", yearId)
      .single();

    if (yearError || !year) {
      renderState(grid, "لم يتم العثور على هذه السنة الدراسية.");
      return;
    }

    const uniName = year.universities?.name || "";
    const facName = year.faculties?.name || "";
    document.title = `السنة ${year.year_number} — ${facName || uniName}`;
    document.getElementById("page-title").textContent = `مواد السنة ${year.year_number}`;
    renderBreadcrumb(document.getElementById("breadcrumb"), [
      { label: "الرئيسية", href: "index.html" },
      { label: uniName, href: `university.html?id=${year.university_id}` },
      { label: facName || "الكلية", href: year.faculty_id ? `faculty.html?id=${year.faculty_id}` : undefined },
      { label: `السنة ${year.year_number}` },
    ]);

    const { data: subjects, error: subjectsError } = await supabaseClient
      .from("subjects")
      .select("id, name, code")
      .eq("year_id", yearId)
      .order("name", { ascending: true });

    if (subjectsError) {
      console.error(subjectsError);
      renderState(grid, "تعذّر تحميل المواد الدراسية.");
      return;
    }

    if (!subjects || subjects.length === 0) {
      renderState(grid, "لا توجد مواد مضافة لهذه السنة بعد.");
      return;
    }

    grid.innerHTML = "";
    subjects.forEach((s) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `subject.html?id=${s.id}`;
      a.innerHTML = `
        <div class="card-icon">${s.name.slice(0, 2)}</div>
        <h3>${s.name}</h3>
        <div class="card-sub">${s.code ? "رمز المادة: " + s.code : "عرض الموارد"}</div>
      `;
      grid.appendChild(a);
    });
  }

  loadYearPage();
</script>
</body>
</html>
